<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D6B49" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>查看收到的回答 — 仍在</title>
    <link rel="icon" type="image/svg+xml" href="__BASE__assets/favicon.svg" />
    <link rel="stylesheet" href="__BASE__collection.css" />
  </head>
  <body data-base="__BASE__">
    <main class="collection-shell receive-shell">
      <header class="collection-brand" aria-label="仍在">
        <span class="collection-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="89 18" transform="rotate(-35 32 32)"/><circle cx="32" cy="32" r="3.5" fill="currentColor"/><circle cx="46" cy="22" r="4" class="mark-sun"/></svg></span>
        <span><b>仍在</b><small>Still Alive</small></span>
      </header>

      <section class="collection-card receive-card">
        <div class="collection-number">02</div>
        <p class="collection-eyebrow">对方已经填写</p>
        <h1>这份回答，等你在<br />&ldquo;仍在&rdquo;里确认。</h1>
        <p class="collection-lead">网页看不到回答内容。打开 App 后，内容会在本机解密，再由你逐项决定是否保存。</p>
        <div class="status-panel" data-status><span class="status-orbit" aria-hidden="true"></span><strong>正在检查回信</strong><p>请稍候。</p></div>
        <div class="receive-actions" data-actions hidden>
          <button class="primary-action" type="button" data-open>在&ldquo;仍在&rdquo;中查看</button>
          <button class="secondary-action" type="button" data-copy-link>复制回信链接</button>
          <button class="text-action" type="button" data-copy-code>复制备用码</button>
          <p class="action-feedback" aria-live="polite" data-feedback></p>
        </div>
      </section>
      <footer class="collection-footer">回答只会在创建邀请的设备上解密</footer>
    </main>
    <script src="__BASE__receive.js" defer></script>
  </body>
</html>
