plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.eternalheart.stillalive'
version = '0.1.0'

android {
  namespace 'com.eternalheart.stillalive.passwordvaultcrypto'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
}
