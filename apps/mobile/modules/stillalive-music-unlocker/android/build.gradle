plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.wh131462.stillalive'
version = '0.1.0'

def reactNativeArchitectures = (findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(',')

android {
  namespace 'com.wh131462.stillalive.musicunlocker'
  externalNativeBuild {
    cmake {
      path file('src/main/cpp/CMakeLists.txt')
    }
  }
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    ndk {
      abiFilters(*reactNativeArchitectures)
    }
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17'
      }
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
