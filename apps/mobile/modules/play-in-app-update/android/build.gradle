plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.eternalheart.stillalive'
version = '1.0.0'

android {
  namespace 'com.eternalheart.stillalive.playupdate'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.google.android.play:app-update-ktx:2.1.0'
}
