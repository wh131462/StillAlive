<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-title-key="story_title">Still Alive</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <style>
    /* Desktop nav */
    .desktop-nav {
      position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--line);
      background: var(--bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .desktop-nav .inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    @media (min-width: 768px) { .desktop-nav .inner { padding: 0 40px; } }
    @media (min-width: 1024px) { .desktop-nav .inner { padding: 0 48px; } }

    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-pulse { width: 32px; height: 32px; background: var(--life); display: flex; align-items: center; justify-content: center; animation: breathe 3s var(--ease-breath) infinite; flex-shrink: 0; }
    .nav-pulse svg { width: 16px; height: 16px; stroke: var(--bg); }
    .nav-title { font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink); }
    .nav-links { display: flex; align-items: center; gap: 16px; }
    @media (min-width: 768px) { .nav-links { gap: 24px; } }
    .nav-link {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--ink-faint); transition: color 0.3s;
      text-decoration: none;
    }
    .nav-link.active { color: var(--life); }
    .nav-link:hover { color: var(--life); }
    /* Hide secondary nav links on mobile */
    @media (max-width: 639px) {
      .nav-link.secondary { display: none; }
    }

    .nav-toolbar { display: flex; gap: 8px; align-items: center; }
    #lang-toggle, #theme-toggle {
      width: 32px; height: 32px;
    }

    .nav-login {
      padding: 8px 16px; background: var(--ink); color: var(--bg);
      font-family: var(--font-body); font-size: 13px; letter-spacing: 0.04em;
      transition: background 0.3s; border: none; text-decoration: none; cursor: pointer;
    }
    @media (min-width: 768px) { .nav-login { padding: 8px 20px; } }
    .nav-login:hover { background: var(--life); }

    /* Hero */
    .hero { max-width: 1200px; margin: 0 auto; padding: 56px 24px; text-align: center; }
    @media (min-width: 768px) { .hero { padding: 72px 40px; } }
    @media (min-width: 1024px) { .hero { padding: 80px 48px; } }
    .hero h1 { font-family: var(--font-body); font-weight: 700; font-size: clamp(36px, 6vw, 80px); margin: 0; line-height: 1; letter-spacing: -0.005em; }
    .hero p { font-family: var(--font-display); font-style: italic; font-size: 15px; color: var(--ink-soft); max-width: 480px; margin: 24px auto 0; line-height: 1.8; }
    @media (min-width: 768px) { .hero p { font-size: 16px; } }

    /* Main layout */
    .main {
      max-width: 1200px; margin: 0 auto; padding: 0 24px 80px;
      display: flex; flex-direction: column; gap: 32px;
    }
    @media (min-width: 768px) {
      .main { padding: 0 40px 80px; gap: 40px; }
    }
    @media (min-width: 1024px) {
      .main { padding: 0 48px 80px; flex-direction: row; gap: 56px; }
    }

    .sidebar { width: 100%; flex-shrink: 0; }
    @media (min-width: 1024px) {
      .sidebar { width: 200px; position: sticky; top: 80px; align-self: flex-start; }
    }
    .sb-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 12px; }

    /* Mobile/tablet: horizontal pills; desktop: vertical list */
    .sb-links {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
    }
    @media (min-width: 1024px) {
      .sb-links { display: block; padding-bottom: 0; }
    }
    .sb-link {
      flex-shrink: 0; padding: 8px 14px;
      font-family: var(--font-body); font-size: 13px; color: var(--ink-faint);
      transition: all 0.3s; border: 1px solid var(--line); text-decoration: none;
    }
    .sb-link.active { color: var(--bg); background: var(--ink); border-color: var(--ink); }
    .sb-link:hover { color: var(--life); border-color: var(--life); }
    @media (min-width: 1024px) {
      .sb-link {
        display: block; padding: 10px 0; border: none;
        border-bottom: 1px dashed var(--line);
      }
      .sb-link.active { color: var(--life); background: transparent; padding-left: 8px; border-bottom-color: var(--life); }
      .sb-link:hover { padding-left: 8px; border-color: transparent; border-bottom: 1px dashed var(--life); }
    }

    .shuffle-btn {
      width: 100%; padding: 12px; margin-top: 16px;
      border: 1px dashed var(--line); background: transparent;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--ink-faint);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.3s; cursor: pointer;
    }
    .shuffle-btn:hover { border-color: var(--life); color: var(--life); }
    @media (min-width: 1024px) { .shuffle-btn { margin-top: 24px; } }

    .feed { flex: 1; min-width: 0; }
    .story-card { padding: 28px 0; border-top: 1px solid var(--line); display: block; transition: padding 0.3s; position: relative; text-decoration: none; color: inherit; }
    @media (min-width: 768px) { .story-card { padding: 32px 0; } }
    .story-card:hover { padding-left: 12px; }
    .story-meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .story-meta .cat { padding: 2px 8px; border: 1px solid var(--life); color: var(--life); }
    .story-title-txt { font-family: var(--font-body); font-weight: 700; font-size: 17px; margin-bottom: 8px; }
    @media (min-width: 768px) { .story-title-txt { font-size: 18px; } }
    .story-body-txt { font-family: var(--font-display); font-style: italic; font-size: 15px; line-height: 1.9; color: var(--ink); }
    @media (min-width: 768px) { .story-body-txt { font-size: 16px; line-height: 1.95; } }
    .story-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .resonance { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; display: flex; align-items: center; gap: 6px; }
    .resonance svg { width: 14px; height: 14px; stroke: var(--life); }
    .read-more { font-family: var(--font-mono); font-size: 11px; color: var(--life); letter-spacing: 0.15em; text-transform: uppercase; opacity: 0; transition: opacity 0.3s; }
    .story-card:hover .read-more { opacity: 1; }
    @media (max-width: 1023px) { .read-more { opacity: 1; } }

    .warning-card { padding: 24px; border: 1px solid var(--line); border-left: 4px solid #d4a017; margin-top: 24px; }
    @media (min-width: 768px) { .warning-card { padding: 28px; } }
    .warning-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: #d4a017; text-transform: uppercase; margin-bottom: 8px; }
    .warning-card p { font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--ink-soft); margin: 0; }
    .warning-card a { font-family: var(--font-mono); font-size: 11px; color: var(--life); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 12px; display: inline-block; text-decoration: none; }

    /* Footer */
    .foot { border-top: 1px solid var(--line); margin-top: 40px; }
    .foot .inner {
      max-width: 1200px; margin: 0 auto; padding: 32px 24px;
      display: flex; flex-direction: column; gap: 16px;
      justify-content: space-between; align-items: start;
    }
    @media (min-width: 768px) {
      .foot .inner { padding: 40px 40px; flex-direction: row; align-items: end; }
    }
    @media (min-width: 1024px) { .foot .inner { padding: 40px 48px; } }
    .foot-brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--ink-soft); }
    .foot-mini { width: 20px; height: 20px; background: var(--life); display: flex; align-items: center; justify-content: center; }
    .foot-mini svg { width: 10px; height: 10px; stroke: var(--bg); }
    .foot-links { display: flex; gap: 24px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: var(--ink-faint); text-transform: uppercase; flex-wrap: wrap; }
    .foot-links a { color: var(--ink-faint); text-decoration: none; }
    .foot-links a:hover { color: var(--life); }

    .loading-more {
      text-align: center; padding: 40px 0;
      font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint);
      letter-spacing: 0.15em; text-transform: uppercase;
      animation: breathe 2s var(--ease-breath) infinite;
    }
  </style>
</head>
<body class="grain">
  <nav class="desktop-nav">
    <div class="inner">
      <a href="../index.html" class="nav-brand">
        <div class="nav-pulse"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg></div>
        <span class="nav-title" data-i18n="app_name_en"></span>
      </a>
      <div class="nav-links">
        <a href="#" class="nav-link active" data-i18n="nav_stories"></a>
        <a href="#" class="nav-link secondary" data-i18n="nav_submit"></a>

        <div class="nav-toolbar">

      <a href="../story/detail.html" class="story-card fade-up fade-up-5">
        <div class="story-meta"><span class="cat" style="border-color:#5581b3;color:#5581b3" data-i18n="story_nature"></span><span data-i18n="story_meta_autumn"></span></div>

        <div class="story-foot"><span class="resonance"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>2,031</span><span class="read-more" data-i18n="home_read"></span></div>
      </a>

      <div class="loading-more" data-i18n="story_loading"></div>
    </div>
  </div>

  <footer class="foot">
    <div class="inner">
      <div class="foot-brand">
        <div class="foot-mini"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg></div>
        <span data-i18n="web_footer_brand"></span>
      </div>
      <div class="foot-links">
        <a href="#" data-i18n="web_footer_about"></a>
        <a href="#" data-i18n="web_footer_terms"></a>
        <a href="#" data-i18n="web_footer_privacy"></a>

</body>
</html>
