<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>登录 · 还活着</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <style>
    body { min-height: 100vh; }
    .frame { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 32px; }

    /* Top */
    .top { display: flex; justify-content: space-between; padding: 32px 0 0; }
    .top .mark { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; line-height: 1.6; }
    #theme-toggle {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--surface); transition: all 0.4s var(--ease-breath);
    }
    #theme-toggle::before { content: '🌙'; font-size: 13px; }
    html.dark #theme-toggle::before { content: '☀'; }

    /* Hero */
    .hero { padding: 64px 0 32px; }
    .hero-pulse {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--life); display: flex; align-items: center; justify-content: center;
      margin-bottom: 32px;
      animation: breathe-glow 3s var(--ease-breath) infinite, breathe 1.5s var(--ease-breath) infinite;
    }
    .hero-pulse svg { stroke: var(--bg); width: 24px; height: 24px; }
    .hero h1 {
      font-family: var(--font-display); font-style: italic; font-weight: 400;
      font-size: 56px; line-height: 0.95; margin: 0; letter-spacing: -0.02em;
    }
    .hero h1 .zh {
      display: block; font-family: var(--font-body); font-style: normal; font-weight: 700;
      font-size: 44px; margin-top: 4px; letter-spacing: 0.02em;
    }
    .hero-sub {
      margin-top: 24px; font-size: 14px; color: var(--ink-soft);
      font-family: var(--font-display); font-style: italic;
    }
    .hero-sub::before { content: '— '; }

    /* Tabs */
    .tabs {
      margin-top: 48px; display: flex; gap: 32px;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      padding: 12px 0; font-size: 13px; color: var(--ink-faint);
      letter-spacing: 0.05em; position: relative; cursor: pointer; background: none; border: none;
      font-family: var(--font-mono);
    }
    .tab.active { color: var(--ink); }
    .tab.active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
      height: 1px; background: var(--life);
    }

    /* Form */
    .form { margin-top: 32px; flex: 1; }
    .field { margin-bottom: 24px; }
    .label {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px;
      display: flex; justify-content: space-between;
    }
    .input {
      display: flex; align-items: center;
      border-bottom: 1px solid var(--line); padding-bottom: 8px;
      transition: border-color 0.3s;
    }
    .input:focus-within { border-bottom-color: var(--life); }
    .input .prefix { font-family: var(--font-mono); color: var(--ink-faint); margin-right: 8px; font-size: 14px; }
    .input input {
      flex: 1; border: none; background: transparent; outline: none;
      font-size: 16px; color: var(--ink); padding: 4px 0;
    }
    .input input::placeholder { color: var(--ink-faint); font-style: italic; font-family: var(--font-display); }
    .input .otp {
      font-size: 11px; color: var(--life); font-family: var(--font-mono);
      letter-spacing: 0.15em; padding-left: 12px; border-left: 1px solid var(--line);
      background: none; border: none; border-left: 1px solid var(--line);
    }

    .agree { display: flex; gap: 12px; align-items: flex-start; margin-top: 32px; font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
    .check {
      width: 16px; height: 16px; border: 1px solid var(--ink-faint); border-radius: 2px;
      flex-shrink: 0; margin-top: 2px; cursor: pointer; position: relative;
    }
    .check[data-on="1"] { background: var(--life); border-color: var(--life); }
    .check[data-on="1"]::after { content: '✓'; position: absolute; inset: 0; color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 11px; }

    /* Button */
    .submit {
      width: 100%; padding: 18px; margin-top: 24px;
      background: var(--ink); color: var(--bg); border: none; border-radius: 0;
      font-family: var(--font-display); font-style: italic; font-size: 17px;
      letter-spacing: 0.05em;
      transition: transform 0.4s var(--ease-breath), background 0.3s;
      position: relative; overflow: hidden;
    }
    .submit::before {
      content: ''; position: absolute; inset: 0;
      background: var(--life); transform: translateY(100%);
      transition: transform 0.4s var(--ease-breath);
    }
    .submit:hover::before { transform: translateY(0); }
    .submit span { position: relative; z-index: 1; }

    /* Switch links */
    .switch { display: flex; justify-content: space-between; margin-top: 24px; font-size: 12px; }
    .switch a { color: var(--ink-faint); transition: color 0.3s; }
    .switch a:hover { color: var(--life); }

    /* Other ways */
    .others { margin-top: 56px; padding-bottom: 40px; }
    .divider {
      display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
      color: var(--ink-faint); text-transform: uppercase;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .third { display: flex; gap: 16px; justify-content: center; }
    .third button {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
      transition: all 0.3s;
    }
    .third button:hover { color: var(--life); border-color: var(--life); transform: translateY(-2px); }

    /* Decoration: page number */
    .page-no {
      position: fixed; left: 16px; bottom: 16px;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
      color: var(--ink-faint); writing-mode: vertical-rl; transform: rotate(180deg);
    }
  </style>
</head>
<body class="grain">

  <span class="page-no">01 / IDENTITY · LOG IN</span>

  <div class="frame">

    <div class="top">
      <div class="mark fade-up">
        STILL ALIVE<br>
        <span style="color:var(--life)">Login</span>
      </div>
      <button id="theme-toggle" aria-label="theme"></button>
    </div>

    <div class="hero">
      <div class="hero-pulse fade-up fade-up-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l3-9 4 18 3-9h4"/>
        </svg>
      </div>
      <h1 class="fade-up fade-up-2">
        <span>Hello,</span>
        <span class="zh">还<span style="color:var(--life)">活</span>着吗？</span>
      </h1>
      <p class="hero-sub fade-up fade-up-3">today asks the same gentle question</p>
    </div>

    <div class="tabs fade-up fade-up-3">
      <button class="tab active">手机号 · Phone</button>
      <button class="tab">邮箱 · Email</button>
    </div>

    <form class="form fade-up fade-up-4" onsubmit="event.preventDefault();window.location.href='../home/index.html'">

      <div class="field">
        <div class="label"><span>手机号</span><span>PHONE</span></div>
        <div class="input">
          <span class="prefix">+86</span>
          <input type="tel" placeholder="your number">
        </div>
      </div>

      <div class="field">
        <div class="label"><span>验证码</span><span>OTP</span></div>
        <div class="input">
          <input type="text" maxlength="6" placeholder="six digits">
          <button type="button" class="otp">SEND →</button>
        </div>
      </div>

      <label class="agree">
        <span class="check" data-on="1" onclick="this.dataset.on=this.dataset.on==='1'?'0':'1'"></span>
        <span>已阅读并同意《用户协议》《隐私政策》。每一次登录，都是一次确认存在的仪式。</span>
      </label>

      <button type="submit" class="submit"><span>Confirm I'm here · 确认存活</span></button>

      <div class="switch">
        <a href="register.html">注册账号 · New here</a>
        <a href="forgot.html">忘记密码 · Forgot</a>
      </div>
    </form>

    <div class="others fade-up fade-up-5">
      <div class="divider">Other ways · 其他方式</div>
      <div class="third">
        <button title="微信">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8.7 13.4c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zm5.2 0c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zM9.5 4C5.4 4 2 6.7 2 10c0 1.9 1.1 3.6 2.9 4.7L4 17l2.6-1.4c.9.2 1.8.4 2.9.4h.6c-.1-.4-.1-.8-.1-1.2 0-3.3 3.3-6 7.3-6h.6C17.5 6 13.8 4 9.5 4zm12.5 10.7c0-2.7-2.7-4.9-6-4.9s-6 2.2-6 4.9 2.7 4.9 6 4.9c.7 0 1.4-.1 2-.3l1.9.9-.6-1.6c1.6-.9 2.7-2.3 2.7-3.9zm-8 0c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7zm4 0c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7z"/></svg>
        </button>
        <button title="Apple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        </button>
      </div>
    </div>

  </div>

</body>
</html>
