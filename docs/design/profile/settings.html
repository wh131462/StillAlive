<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title data-i18n-title-key="settings_title">Still Alive</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <style>
    .frame {
      width: 100%; max-width: 430px; margin: 0 auto;
      min-height: 100vh; padding: 0 24px 40px;
    }
    @media (min-width: 768px) { .frame { max-width: 720px; padding: 0 40px 60px; } }
    @media (min-width: 1024px) { .frame { max-width: 880px; padding: 0 48px 80px; } }

    .top { padding: 24px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .back { background: none; border: none; color: var(--ink-faint); font-size: 14px; cursor: pointer; }
    .top-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink); text-transform: uppercase; }
    .top-actions { display: flex; gap: 8px; }

    h1.title { font-family: var(--font-body); font-weight: 700; font-size: 28px; margin: 24px 0 4px; line-height: 1.1; letter-spacing: -0.005em; }
    @media (min-width: 768px) { h1.title { font-size: 36px; } }

    .section-t { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; margin-top: 32px; margin-bottom: 0; }

    /* Desktop: 2-col groups */
    .groups-row {
      display: grid; grid-template-columns: 1fr; gap: 0;
    }
    @media (min-width: 1024px) {
      .groups-row { grid-template-columns: 1fr 1fr; gap: 0 48px; align-items: start; }
    }

    .group { border-top: 1px solid var(--line); margin-top: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); gap: 12px; }
    .row-info { flex: 1; min-width: 0; }
    .row-info h3 { font-size: 14px; margin: 0 0 2px; }
    .row-info p { font-size: 10px; color: var(--ink-faint); margin: 0; font-family: var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; }
    .toggle-sw { width: 44px; height: 24px; background: var(--life); border-radius: 12px; padding: 2px; flex-shrink: 0; cursor: pointer; }
    .toggle-sw .dot { width: 20px; height: 20px; background: var(--bg); border-radius: 50%; margin-left: 20px; }
    .toggle-sw.off { background: var(--line); }
    .toggle-sw.off .dot { margin-left: 0; }
    .val { font-family: var(--font-mono); font-size: 13px; color: var(--life); letter-spacing: 0.1em; }

    .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .theme-opt { padding: 14px 8px; text-align: center; border: 1px solid var(--line); font-family: var(--font-body); font-size: 12px; cursor: pointer; transition: all 0.3s; }
    .theme-opt.active { background: var(--life-soft); border-color: var(--life); color: var(--life); }
    .theme-opt .ico { font-size: 18px; display: block; margin-bottom: 6px; }

    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); transition: padding 0.3s; text-decoration: none; color: inherit; gap: 12px; }
    .menu-item:hover { padding-left: 8px; }
    .menu-item h3 { font-size: 14px; margin: 0 0 2px; }
    .menu-item p { font-size: 10px; color: var(--ink-faint); margin: 0; font-family: var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; }

    .logout { margin-top: 32px; padding: 16px; width: 100%; border: 1px solid #c44; background: transparent; color: #c44; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; transition: all 0.3s; cursor: pointer; }
    .logout:hover { background: #c44; color: var(--bg); }
    .version { text-align: center; margin-top: 16px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: var(--ink-faint); text-transform: uppercase; }
  </style>
</head>
<body class="grain">
  <div class="frame">
    <div class="top">
      <a href="index.html" class="back" data-i18n="auth_back"></a>
      <span class="top-title" data-i18n="settings_top_title"></span>
      <div class="top-actions">
        <button id="lang-toggle"></button>
        <button id="theme-toggle" data-i18n-aria="theme_toggle"></button>
      </div>
    </div>
    <h1 class="title fade-up fade-up-1" data-i18n="settings_title"></h1>

    <div class="groups-row">
      <div>
        <div class="section-t" data-i18n="settings_reminder"></div>
        <div class="group fade-up fade-up-2">
          <div class="row"><div class="row-info"><h3 data-i18n="settings_daily"></h3><p data-i18n="settings_daily_sub"></p></div><div class="toggle-sw"><div class="dot"></div></div></div>
          <div class="row"><div class="row-info"><h3 data-i18n="settings_time"></h3><p data-i18n="settings_time_sub"></p></div><span class="val">21:00</span></div>
        </div>

        <div class="section-t" data-i18n="settings_appearance"></div>
        <div class="themes fade-up fade-up-3">
          <div class="theme-opt"><span class="ico">☀</span><span data-i18n="settings_light"></span></div>
          <div class="theme-opt"><span class="ico">🌙</span><span data-i18n="settings_dark"></span></div>
          <div class="theme-opt active"><span class="ico">◐</span><span data-i18n="settings_system"></span></div>
        </div>

        <div class="section-t" data-i18n="settings_notifications"></div>
        <div class="group fade-up fade-up-4">
          <div class="row"><div class="row-info"><h3 data-i18n="settings_birthday_notify"></h3></div><div class="toggle-sw"><div class="dot"></div></div></div>
          <div class="row"><div class="row-info"><h3 data-i18n="settings_milestone_notify"></h3></div><div class="toggle-sw"><div class="dot"></div></div></div>
          <div class="row"><div class="row-info"><h3 data-i18n="settings_story_notify"></h3></div><div class="toggle-sw off"><div class="dot"></div></div></div>
        </div>
      </div>

      <div>
        <div class="section-t" data-i18n="settings_data"></div>
        <div class="group fade-up fade-up-5">
          <a href="#" class="menu-item"><div><h3 data-i18n="settings_backup"></h3><p data-i18n="settings_backup_sub"></p></div><span style="color:var(--ink-faint)">→</span></a>
          <a href="#" class="menu-item"><div><h3 data-i18n="settings_cache"></h3><p>12.3 MB</p></div><span style="color:var(--ink-faint)">→</span></a>
        </div>

        <div class="section-t" data-i18n="settings_help"></div>
        <div class="group fade-up fade-up-6">
          <a href="#" class="menu-item"><div><h3 data-i18n="settings_feedback"></h3></div><span style="color:var(--ink-faint)">→</span></a>
          <a href="#" class="menu-item"><div><h3 data-i18n="settings_terms"></h3></div><span style="color:var(--ink-faint)">→</span></a>
          <a href="#" class="menu-item"><div><h3 data-i18n="settings_privacy"></h3></div><span style="color:var(--ink-faint)">→</span></a>
        </div>
      </div>
    </div>

    <button class="logout fade-up fade-up-6" data-i18n="settings_logout"></button>
    <p class="version" data-i18n="settings_version"></p>
  </div>
</body>
</html>
