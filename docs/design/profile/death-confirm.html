<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title data-i18n-title-key="death_title">Still Alive</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <style>
    .frame {
      width: 100%; max-width: 430px; margin: 0 auto;
      min-height: 100vh; padding: 0 24px 40px;
    }
    @media (min-width: 768px) { .frame { max-width: 720px; padding: 0 40px 60px; } }
    @media (min-width: 1024px) { .frame { max-width: 880px; padding: 0 48px 80px; } }

    .top { padding: 24px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .back { background: none; border: none; color: var(--ink-faint); font-size: 14px; cursor: pointer; }
    .top-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink); text-transform: uppercase; }
    .top-actions { display: flex; gap: 8px; }

    h1.title { font-family: var(--font-body); font-weight: 700; font-size: 28px; margin: 24px 0 4px; line-height: 1.1; letter-spacing: -0.005em; }
    @media (min-width: 768px) { h1.title { font-size: 36px; } }

    .warning { margin-top: 24px; padding: 20px 20px 20px 24px; border-left: 3px solid #c44; background: rgba(204,68,68,0.06); font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--ink-soft); line-height: 1.85; }

    /* Desktop 2-col main */
    .main {
      display: grid; grid-template-columns: 1fr; gap: 0;
    }
    @media (min-width: 1024px) {
      .main { grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
    }

    .section-t { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; margin-top: 32px; margin-bottom: 12px; }
    .toggle-row { padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .toggle-info { flex: 1; min-width: 0; }
    .toggle-info h3 { font-size: 15px; margin: 0 0 4px; }
    .toggle-info p { font-size: 11px; color: var(--ink-soft); margin: 0; font-family: var(--font-mono); letter-spacing: 0.05em; }
    .toggle-sw { width: 44px; height: 24px; background: var(--life); border-radius: 12px; padding: 2px; position: relative; flex-shrink: 0; cursor: pointer; }
    .toggle-sw .dot { width: 20px; height: 20px; background: var(--bg); border-radius: 50%; margin-left: 20px; transition: margin 0.3s; }
    .days-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .day-opt { padding: 14px; text-align: center; border: 1px solid var(--line); font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s; }
    .day-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .note { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); margin-top: 8px; letter-spacing: 0.05em; }
    .input { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-top: 8px; }
    .input:focus-within { border-bottom-color: var(--life); }
    .input input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; color: var(--ink); min-width: 0; }
    .email-preview { padding: 20px; border: 1px dashed var(--line); font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--ink-soft); line-height: 1.85; }
    .email-preview .subject { font-family: var(--font-body); font-style: normal; font-weight: 700; font-size: 14px; color: var(--ink); margin-bottom: 12px; }

    .page-no { position: fixed; left: 16px; bottom: 16px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); writing-mode: vertical-rl; transform: rotate(180deg); }
    @media (max-width: 767px) { .page-no { display: none; } }
  </style>
</head>
<body class="grain">
  <span class="page-no">06 / SELF · DEATH</span>
  <div class="frame">
    <div class="top">
      <a href="index.html" class="back" data-i18n="auth_back"></a>
      <span class="top-title" data-i18n="death_top_title"></span>
      <div class="top-actions">
        <button id="lang-toggle"></button>
        <button id="theme-toggle" data-i18n-aria="theme_toggle"></button>
      </div>
    </div>
    <h1 class="title fade-up fade-up-1" data-i18n="death_title"></h1>
    <div class="warning fade-up fade-up-2" data-i18n="death_warning"></div>

    <div class="main">
      <div>
        <div class="section-t" data-i18n="death_switch"></div>
        <div class="toggle-row fade-up fade-up-3">
          <div class="toggle-info"><h3 data-i18n="death_enable"></h3><p data-i18n="death_enable_sub"></p></div>
          <div class="toggle-sw"><div class="dot"></div></div>
        </div>

        <div class="section-t" data-i18n="death_days"></div>
        <div class="days-grid fade-up fade-up-3">
          <span class="day-opt">3</span>
          <span class="day-opt active">7</span>
          <span class="day-opt">14</span>
          <span class="day-opt">30</span>
        </div>
        <p class="note" data-i18n="death_days_note"></p>

        <div class="section-t" data-i18n="death_contact"></div>
        <div class="input fade-up fade-up-4"><input type="email" value="family@example.com"></div>
        <p class="note" data-i18n="death_contact_note"></p>
      </div>

      <div>
        <div class="section-t" data-i18n="death_preview"></div>
        <div class="email-preview fade-up fade-up-5">
          <div class="subject" data-i18n="death_email_subject"></div>
          <p data-i18n="death_email_body_1"></p>
          <p><span data-i18n="death_email_body_2_a"></span> <strong>Let me</strong> <span data-i18n="death_email_body_2_b"></span></p>
          <p data-i18n="death_email_body_3"></p>
          <p style="color:var(--ink-faint)" data-i18n="death_email_sign"></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
