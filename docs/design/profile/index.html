<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="sa-tab" content="profile">
  <title data-i18n-title-key="profile_title">Still Alive</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/nav.js"></script>
  <style>
    .frame {
      width: 100%; max-width: 430px; margin: 0 auto;
      min-height: 100vh; padding: 0 24px 96px;
    }
    @media (min-width: 768px) { .frame { max-width: 720px; padding: 0 40px 40px; } }
    @media (min-width: 1024px) { .frame { max-width: 1100px; padding: 0 48px 80px; margin-left: 200px; } }

    .top { padding: 24px 0 0; display: flex; justify-content: space-between; align-items: start; }
    .top-mark { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; line-height: 1.6; }
    .top-mark .accent { color: var(--life); }
    .top-actions { display: flex; gap: 8px; }

    h1.title { font-family: var(--font-body); font-weight: 700; font-size: 36px; margin: 24px 0 4px; line-height: 1; letter-spacing: -0.005em; }
    @media (min-width: 768px) { h1.title { font-size: 48px; } }

    /* Identity */
    .identity { margin-top: 32px; padding: 24px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--life), var(--green)); display: flex; align-items: center; justify-content: center; color: var(--bg); font-family: var(--font-body); font-weight: 700; font-size: 28px; animation: breathe 3s var(--ease-breath) infinite; flex-shrink: 0; }
    .id-info { flex: 1; min-width: 0; }
    .id-name { font-family: var(--font-body); font-weight: 700; font-size: 20px; }
    .id-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.05em; }
    .id-meta .num { color: var(--life); font-family: var(--font-display); font-style: italic; font-size: 16px; }

    .section-t { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; margin: 32px 0 16px; }

    /* Stats + Heatmap row on desktop */
    .stats-heat-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 1024px) {
      .stats-heat-row { grid-template-columns: 320px 1fr; gap: 32px; align-items: start; }
    }

    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--line); }
    .stat { padding: 20px 12px; text-align: center; border-right: 1px solid var(--line); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--font-display); font-size: 28px; line-height: 1; }
    .stat-num.life { color: var(--life); }
    .stat-lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; color: var(--ink-faint); text-transform: uppercase; margin-top: 6px; }

    .heatmap-wrap { padding: 20px; border: 1px solid var(--line); }
    .heatmap-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    .heatmap-h h3 { font-family: var(--font-display); font-style: italic; font-size: 16px; margin: 0; }
    .heatmap-h span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; }
    .heatmap { display: grid; grid-template-columns: repeat(52, 1fr); gap: 2px; }
    .cell { aspect-ratio: 1; }
    .legend-h { display: flex; gap: 4px; align-items: center; justify-content: flex-end; margin-top: 10px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; text-transform: uppercase; }
    .lc { width: 10px; height: 10px; }

    /* Badges */
    .badges { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
    .badge { flex-shrink: 0; text-align: center; }
    .badge-circle { width: 56px; height: 56px; border-radius: 50%; background: var(--bg-subtle); display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 6px; }
    .badge.done .badge-circle { background: var(--green-soft); }
    .badge.now .badge-circle { background: var(--life-soft); border: 2px solid var(--life); }
    .badge.locked { opacity: 0.4; }
    .badge-lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; color: var(--ink-faint); text-transform: uppercase; }
    .badge.now .badge-lbl { color: var(--life); }

    /* Menu — desktop 2-col */
    .menu {
      display: grid;
      grid-template-columns: 1fr;
      border-top: 1px solid var(--line); margin-top: 16px;
    }
    @media (min-width: 1024px) {
      .menu { grid-template-columns: 1fr 1fr; gap: 0 32px; }
    }
    .menu-item {
      display: flex; align-items: center; gap: 16px; padding: 18px 0;
      border-bottom: 1px solid var(--line); transition: padding 0.3s;
      text-decoration: none; color: inherit;
    }
    .menu-item:hover { padding-left: 8px; }
    .menu-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .menu-icon svg { width: 20px; height: 20px; stroke: var(--ink-soft); stroke-width: 1.5; fill: none; }
    .menu-icon.danger svg { stroke: #c44; }
    .menu-icon.life svg { stroke: var(--life); }
    .menu-info { flex: 1; min-width: 0; }
    .menu-title { font-size: 15px; font-weight: 500; }
    .menu-sub { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); margin-top: 2px; letter-spacing: 0.05em; text-transform: uppercase; }
    .menu-arrow { color: var(--ink-faint); font-size: 12px; }
  </style>
</head>
<body class="grain">
  <div class="frame">
    <div class="top">
      <div class="top-mark fade-up">
        <span data-i18n="profile_top_mark"></span><br>
        <span class="accent" data-i18n="profile_day"></span>
      </div>
      <div class="top-actions">
        <button id="lang-toggle"></button>
        <button id="theme-toggle" data-i18n-aria="theme_toggle"></button>
      </div>
    </div>

    <h1 class="title fade-up fade-up-1" data-i18n="profile_title"></h1>

    <div class="identity fade-up fade-up-2">
      <div class="avatar">L</div>
      <div class="id-info">
        <div class="id-name">Let me</div>
        <div class="id-meta"><span data-i18n="profile_id_meta_a"></span> <span class="num">127</span> <span data-i18n="profile_id_meta_b"></span></div>
      </div>
      <span class="menu-arrow">→</span>
    </div>

    <div class="section-t" data-i18n="profile_stats"></div>
    <div class="stats-heat-row">
      <div class="stats fade-up fade-up-3">
        <div class="stat"><div class="stat-num life">127</div><div class="stat-lbl" data-i18n="profile_days"></div></div>
        <div class="stat"><div class="stat-num">8</div><div class="stat-lbl" data-i18n="profile_people"></div></div>
        <div class="stat"><div class="stat-num">42</div><div class="stat-lbl" data-i18n="profile_records"></div></div>
      </div>

      <div class="heatmap-wrap fade-up fade-up-4">
        <div class="heatmap-h">
          <h3 data-i18n="profile_heatmap_title"></h3>
          <span data-i18n="profile_heatmap_sub"></span>
        </div>
        <div class="heatmap" id="hm"></div>
        <script>
          (function () {
            var hm = document.getElementById('hm');
            for (var w = 0; w < 52; w++) {
              for (var d = 0; d < 7; d++) {
                var c = document.createElement('div');
                c.className = 'cell';
                var doy = w * 7 + d;
                var bg = '#E8E0D8';
                if (doy > 121) bg = 'var(--bg-subtle)';
                else if (Math.random() > 0.15) {
                  var i = Math.random();
                  if (i > 0.7) bg = 'var(--life)';
                  else if (i > 0.4) bg = 'rgba(194,77,44,0.55)';
                  else bg = 'rgba(194,77,44,0.25)';
                }
                c.style.background = bg;
                hm.appendChild(c);
              }
            }
          })();
        </script>
        <div class="legend-h">
          <span data-i18n="profile_legend_less"></span>
          <span class="lc" style="background:rgba(194,77,44,0.25)"></span>
          <span class="lc" style="background:rgba(194,77,44,0.55)"></span>
          <span class="lc" style="background:var(--life)"></span>
          <span data-i18n="profile_legend_more"></span>
        </div>
      </div>
    </div>

    <div class="section-t" data-i18n="profile_milestones"></div>
    <div class="badges fade-up fade-up-5">
      <div class="badge done"><div class="badge-circle">🌱</div><div class="badge-lbl" data-i18n="profile_badge_7"></div></div>
      <div class="badge done"><div class="badge-circle">🌿</div><div class="badge-lbl" data-i18n="profile_badge_30"></div></div>
      <div class="badge now"><div class="badge-circle">🌳</div><div class="badge-lbl" data-i18n="profile_badge_100"></div></div>
      <div class="badge locked"><div class="badge-circle">🏔</div><div class="badge-lbl" data-i18n="profile_badge_365"></div></div>
      <div class="badge locked"><div class="badge-circle">⭐</div><div class="badge-lbl" data-i18n="profile_badge_1000"></div></div>
    </div>

    <div class="section-t" data-i18n="profile_settings"></div>
    <div class="menu fade-up fade-up-6">
      <a href="death-confirm.html" class="menu-item">
        <div class="menu-icon danger"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7v4l2 2v3h2v2h6v-2h2v-3l2-2V9a7 7 0 00-7-7zM9 11h.01M15 11h.01"/></svg></div>
        <div class="menu-info"><div class="menu-title" data-i18n="profile_death_confirm"></div><div class="menu-sub" data-i18n="profile_death_sub"></div></div>
        <span class="menu-arrow">→</span>
      </a>
      <a href="#" class="menu-item">
        <div class="menu-icon life"><svg viewBox="0 0 24 24"><path d="M20.24 12.24a6 6 0 00-8.49-8.49L5 10.5V19h8.5zM16 8L2 22M17.5 15H9"/></svg></div>
        <div class="menu-info"><div class="menu-title" data-i18n="profile_my_stories"></div><div class="menu-sub" data-i18n="profile_my_stories_sub"></div></div>
        <span class="menu-arrow">→</span>
      </a>
      <a href="settings.html" class="menu-item">
        <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1z"/></svg></div>
        <div class="menu-info"><div class="menu-title" data-i18n="profile_settings"></div><div class="menu-sub" data-i18n="profile_settings_sub"></div></div>
        <span class="menu-arrow">→</span>
      </a>
      <a href="#" class="menu-item">
        <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></div>
        <div class="menu-info"><div class="menu-title" data-i18n="profile_about"></div><div class="menu-sub" data-i18n="profile_about_sub"></div></div>
        <span class="menu-arrow">→</span>
      </a>
    </div>
  </div>
</body>
</html>
