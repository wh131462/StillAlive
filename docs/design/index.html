<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-title-key="app_name">Still Alive</title>
  <link rel="stylesheet" href="shared/breathe.css">
  <script src="shared/theme.js"></script>
  <script src="shared/i18n.js"></script>
  <style>
    body { min-height: 100vh; }
    .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 80px 24px 96px; }

    /* Hero */
    .hero { padding: 56px 0 80px; position: relative; }
    .hero-mark {
      position: absolute; top: 0; right: 0;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .hero h1 {
      font-family: var(--font-display); font-style: italic; font-weight: 400;
      font-size: clamp(56px, 12vw, 168px); line-height: 0.95; margin: 0;
      letter-spacing: -0.02em;
    }
    .hero-sub {
      margin-top: 32px; max-width: 560px; font-size: 16px; line-height: 1.9;
      color: var(--ink-soft);
    }

    .heartbeat {
      position: absolute; bottom: 24px; left: 0; width: 100%;
      pointer-events: none; opacity: 0.5;
    }
    .heartbeat svg { width: 100%; height: 60px; }
    .heartbeat path {
      stroke: var(--life); stroke-width: 1.5; fill: none;
      stroke-dasharray: 1200; stroke-dashoffset: 1200;
      animation: draw 4s var(--ease-breath) infinite;
    }
    @keyframes draw {
      0% { stroke-dashoffset: 1200; }
      40%, 60% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }

    /* Module index — mobile single col, tablet 2 col, desktop 2 col */
    .modules {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      border-top: 1px solid var(--line);
    }
    @media (min-width: 768px) {
      .modules { grid-template-columns: 1fr 1fr; }
    }

    .module {
      padding: 32px 0; border-bottom: 1px solid var(--line);
      position: relative; transition: padding 0.4s var(--ease-out);
    }
    @media (min-width: 768px) {
      .module { padding: 40px 0; }
      .module:nth-child(odd) { padding-right: 32px; border-right: 1px solid var(--line); }
      .module:nth-child(even) { padding-left: 32px; }
    }
    @media (min-width: 1024px) {
      .module { padding: 48px 0; }
      .module:nth-child(odd) { padding-right: 48px; }
      .module:nth-child(even) { padding-left: 48px; }
    }

    .module-num {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
      color: var(--ink-faint); margin-bottom: 16px;
    }
    .module h2 {
      font-family: var(--font-body); font-weight: 700;
      font-size: 28px; margin: 0 0 4px; letter-spacing: -0.005em;
    }
    @media (min-width: 768px) { .module h2 { font-size: 32px; } }
    .module p { color: var(--ink-soft); font-size: 14px; margin: 16px 0 24px; max-width: 360px; }
    .module-links { display: flex; flex-direction: column; gap: 2px; }
    .module-links a {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; font-size: 14px; color: var(--ink);
      border-top: 1px dashed var(--line);
      transition: color 0.3s, padding 0.3s;
    }
    .module-links a:first-child { border-top: 1px solid var(--line); }
    .module-links a::after { content: '→'; color: var(--ink-faint); transition: transform 0.3s, color 0.3s; }
    .module-links a:hover { color: var(--life); padding-left: 8px; }
    .module-links a:hover::after { color: var(--life); transform: translateX(4px); }

    /* Module 07 spans full width */
    .module-full {
      border-right: none !important;
      padding: 32px 0 !important;
    }
    @media (min-width: 768px) {
      .module-full {
        grid-column: 1 / -1;
        padding: 40px 0 !important;
      }
    }
    .module-full code {
      font-family: var(--font-mono); background: var(--bg-subtle);
      padding: 2px 6px; border-radius: 3px; font-size: 13px;
    }

    /* Top toolbar (theme + lang) */
    .top-toolbar {
      position: fixed; top: 24px; right: 24px; z-index: 100;
      display: flex; gap: 8px; align-items: center;
    }
    @media (min-width: 768px) {
      .top-toolbar { top: 32px; right: 40px; }
    }
    @media (min-width: 1024px) {
      .top-toolbar { top: 32px; right: 48px; }
    }

    #theme-toggle {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink); font-size: 14px;
      transition: transform 0.4s var(--ease-breath), background 0.6s, border-color 0.6s;
    }
    #theme-toggle:hover { transform: rotate(180deg); }
    #theme-toggle::before { content: '🌙'; }
    html.dark #theme-toggle::before { content: '☀'; }
    @media (min-width: 768px) {
      #theme-toggle { width: 44px; height: 44px; font-size: 15px; }
    }

    /* Footer */
    footer {
      margin-top: 64px; padding-top: 40px; border-top: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 24px;
      justify-content: space-between; align-items: start;
    }
    @media (min-width: 768px) {
      footer { flex-direction: row; align-items: end; }
    }
    footer .stamp {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em;
      color: var(--ink-faint); text-transform: uppercase; line-height: 2;
    }
    footer .quote {
      font-family: var(--font-display); font-style: italic; font-size: 14px;
      color: var(--ink-soft); max-width: 280px; line-height: 1.7;
    }
    @media (min-width: 768px) {
      footer .quote { text-align: right; }
    }

    @media (min-width: 768px) {
      .container { padding: 80px 40px 96px; }
    }
    @media (min-width: 1024px) {
      .container { padding: 80px 48px 120px; }
      .hero { padding: 80px 0 120px; }
      .hero-mark { top: 80px; right: 0; }
    }
  </style>
</head>
<body class="grain">

  <div class="top-toolbar">
    <button id="lang-toggle" data-i18n-aria="lang_toggle"></button>
    <button id="theme-toggle" data-i18n-aria="theme_toggle"></button>
  </div>

  <div class="container">

    <header class="hero">
      <span class="hero-mark fade-up" data-i18n="prd_version"></span>

      <h1 class="fade-up fade-up-1" data-i18n="app_name"></h1>

      <p class="hero-sub fade-up fade-up-2">
        <span data-i18n="hero_sub_a"></span><br>
        <span data-i18n="hero_sub_b"></span><br>
        <span data-i18n="hero_sub_c" data-i18n-html="true"></span>
      </p>

      <div class="heartbeat" aria-hidden="true">
        <svg viewBox="0 0 1200 60" preserveAspectRatio="none">
          <path d="M0 30 L 200 30 L 240 30 L 260 10 L 280 50 L 300 5 L 320 55 L 340 30 L 600 30 L 640 30 L 660 10 L 680 50 L 700 5 L 720 55 L 740 30 L 1200 30"/>
        </svg>
      </div>
    </header>

    <section class="modules">

      <div class="module fade-up fade-up-3">
        <div class="module-num" data-i18n="mod_01_num"></div>
        <h2 data-i18n="mod_01_title"></h2>
        <p data-i18n="mod_01_desc"></p>
        <div class="module-links">
          <a href="auth/login.html" data-i18n="mod_01_link_login"></a>
          <a href="auth/register.html" data-i18n="mod_01_link_register"></a>
          <a href="auth/forgot.html" data-i18n="mod_01_link_forgot"></a>
        </div>
      </div>

      <div class="module fade-up fade-up-3">
        <div class="module-num" data-i18n="mod_02_num"></div>
        <h2 data-i18n="mod_02_title"></h2>
        <p data-i18n="mod_02_desc"></p>
        <div class="module-links">
          <a href="home/index.html" data-i18n="mod_02_link_home"></a>
        </div>
      </div>

      <div class="module fade-up fade-up-4">
        <div class="module-num" data-i18n="mod_03_num"></div>
        <h2 data-i18n="mod_03_title"></h2>
        <p data-i18n="mod_03_desc"></p>
        <div class="module-links">
          <a href="checkin/index.html" data-i18n="mod_03_link_cal"></a>
          <a href="checkin/record.html" data-i18n="mod_03_link_rec"></a>
          <a href="checkin/milestone.html" data-i18n="mod_03_link_ms"></a>
        </div>
      </div>

      <div class="module fade-up fade-up-4">
        <div class="module-num" data-i18n="mod_04_num"></div>
        <h2 data-i18n="mod_04_title"></h2>
        <p data-i18n="mod_04_desc"></p>
        <div class="module-links">
          <a href="person/list.html" data-i18n="mod_04_link_list"></a>
          <a href="person/detail.html" data-i18n="mod_04_link_detail"></a>
        </div>
      </div>

      <div class="module fade-up fade-up-5">
        <div class="module-num" data-i18n="mod_05_num"></div>
        <h2 data-i18n="mod_05_title"></h2>
        <p data-i18n="mod_05_desc"></p>
        <div class="module-links">
          <a href="story/list.html" data-i18n="mod_05_link_list"></a>
          <a href="story/detail.html" data-i18n="mod_05_link_detail"></a>
          <a href="story/submit.html" data-i18n="mod_05_link_submit"></a>
        </div>
      </div>

      <div class="module fade-up fade-up-5">
        <div class="module-num" data-i18n="mod_06_num"></div>
        <h2 data-i18n="mod_06_title"></h2>
        <p data-i18n="mod_06_desc"></p>
        <div class="module-links">
          <a href="profile/index.html" data-i18n="mod_06_link_mine"></a>
          <a href="profile/death-confirm.html" data-i18n="mod_06_link_death"></a>
          <a href="profile/settings.html" data-i18n="mod_06_link_settings"></a>
        </div>
      </div>

      <div class="module module-full fade-up fade-up-6">
        <div class="module-num" data-i18n="mod_07_num"></div>
        <h2 data-i18n="mod_07_title"></h2>
        <p data-i18n="mod_07_desc" data-i18n-html="true"></p>
        <div class="module-links" style="max-width:480px">
          <a href="web/stories.html" data-i18n="mod_07_link_stories"></a>
        </div>
      </div>

    </section>

    <footer>
      <div class="stamp">
        <span data-i18n="footer_stamp_a"></span><br>
        <span data-i18n="footer_stamp_b"></span><br>
        <span data-i18n="footer_stamp_c"></span>
      </div>
      <div class="quote">
        <span data-i18n="footer_quote_a"></span><br>
        <span data-i18n="footer_quote_b"></span><br>
        <span data-i18n="footer_quote_c"></span><br>
        <span data-i18n="footer_quote_d"></span>
      </div>
    </footer>

  </div>

</body>
</html>
