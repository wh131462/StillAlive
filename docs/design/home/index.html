<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="sa-tab" content="home">
  <title data-i18n-title-key="nav_home">Still Alive</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/nav.js"></script>
  <style>
    .frame {
      width: 100%; max-width: 430px; margin: 0 auto;
      min-height: 100vh; padding: 0 24px 96px;
    }
    @media (min-width: 768px) {
      .frame { max-width: 720px; padding: 0 40px 40px; }
    }
    @media (min-width: 1024px) {
      .frame { max-width: 1100px; padding: 0 48px 80px; margin-left: 200px; }
      body { margin-left: 0; }
    }
    body.sa-has-sidebar .frame { /* nav.js auto-applies */ }

    .top { padding: 24px 0 0; display: flex; justify-content: space-between; align-items: start; }
    .top-date { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; line-height: 1.6; }
    .top-date .day { color: var(--life); }
    .top-actions { display: flex; gap: 8px; align-items: center; }

    /* Hero */
    .question { text-align: center; padding: 40px 0 24px; }
    @media (min-width: 768px) { .question { padding: 56px 0 32px; } }
    .question h1 {
      font-family: var(--font-body); font-weight: 700;
      font-size: 40px; line-height: 1.1; margin: 0;
      letter-spacing: -0.005em;
    }
    @media (min-width: 768px) { .question h1 { font-size: 56px; } }
    @media (min-width: 1024px) { .question h1 { font-size: 64px; } }
    .question h1 .life { color: var(--life); position: relative; }

    .streak { margin-top: 32px; display: flex; flex-direction: column; align-items: center; }
    .streak-num {
      font-family: var(--font-display); font-size: 88px; line-height: 1;
      letter-spacing: -0.04em; color: var(--ink); animation: drift 4s var(--ease-breath) infinite;
    }
    @media (min-width: 768px) { .streak-num { font-size: 112px; } }
    .streak-label {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3em;
      color: var(--ink-faint); text-transform: uppercase; margin-top: 8px;
    }

    .heartline { width: 100%; height: 40px; margin: 32px 0 8px; opacity: 0.4; }
    .heartline path { stroke: var(--life); stroke-width: 1.5; fill: none; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 3s var(--ease-breath) infinite; }
    @keyframes draw { 0%{stroke-dashoffset:600} 40%,60%{stroke-dashoffset:0} 100%{stroke-dashoffset:-600} }

    .cta {
      width: 100%; padding: 20px; margin-top: 16px;
      background: var(--life); color: var(--bg); border: none; border-radius: 0;
      font-family: var(--font-body); font-weight: 700; font-size: 17px;
      letter-spacing: 0.04em; transition: transform 0.4s var(--ease-breath);
      animation: breathe-glow 3s var(--ease-breath) infinite;
      position: relative; overflow: hidden; cursor: pointer;
    }
    .cta:hover { transform: scale(1.02); }

    /* Checked-in state */
    .hero-checked { display: none; text-align: center; padding: 40px 0 24px; }
    @media (min-width: 768px) { .hero-checked { padding: 56px 0 32px; } }
    .hero-checked .checked-label {
      font-family: var(--font-body); font-weight: 700;
      font-size: 24px; color: var(--green); margin: 0 0 24px;
      opacity: 0; animation: fade-up 0.6s var(--ease-out) 0.2s both;
    }
    @media (min-width: 768px) { .hero-checked .checked-label { font-size: 32px; } }
    .hero-checked .streak-num {
      font-family: var(--font-display); font-size: 120px; line-height: 1;
      letter-spacing: -0.04em; color: var(--ink);
      animation: breathe 3s var(--ease-breath) infinite, drift 4s var(--ease-breath) infinite;
    }
    @media (min-width: 768px) { .hero-checked .streak-num { font-size: 160px; } }
    .hero-checked .streak-label {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3em;
      color: var(--ink-faint); text-transform: uppercase; margin-top: 12px;
    }
    body.checked .question { display: none; }
    body.checked .hero-checked { display: block; }
    body.checked .heartline { opacity: 0.2; }
    body.checked .cta {
      background: var(--ink); animation: none;
    }

    /* Sections — desktop multi-col grid */
    .sections-wrap {
      margin-top: 48px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }
    @media (min-width: 1024px) {
      .sections-wrap { grid-template-columns: 1fr 1fr; gap: 32px 56px; }
    }
    .section { min-width: 0; }
    .section-head {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px;
    }
    .section-title {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
      color: var(--ink-faint); text-transform: uppercase;
    }
    .section-more {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em;
      color: var(--ink-faint); transition: color 0.3s;
    }
    .section-more:hover { color: var(--life); }

    /* Birthday card */
    .birthday {
      border: 1px solid var(--line); padding: 20px;
      display: flex; align-items: center; gap: 16px;
      transition: border-color 0.3s;
    }
    .birthday:hover { border-color: var(--life); }
    .birthday-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--life), #e8a838);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-body); font-weight: 700; color: var(--bg); font-size: 18px;
      flex-shrink: 0;
    }
    .birthday-info { flex: 1; min-width: 0; }
    .birthday-name { font-weight: 700; font-size: 15px; }
    .birthday-name .tag { color: var(--life); }
    .birthday-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
    .birthday-arrow { color: var(--ink-faint); font-size: 12px; }

    /* Quote */
    .quote-card {
      border-left: 2px solid var(--life);
      padding: 24px 24px 24px 28px;
      background: var(--bg-subtle);
    }
    .quote-card blockquote {
      font-family: var(--font-display); font-style: italic;
      font-size: 16px; line-height: 1.8; margin: 0; color: var(--ink);
    }
    .quote-card .src {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em;
      color: var(--ink-faint); margin-top: 16px; text-transform: uppercase;
    }

    /* Record quick-entry */
    .record-quick { border: 1px solid var(--line); padding: 20px; }
    .record-quick textarea {
      width: 100%; border: none; background: transparent; outline: none;
      font-size: 15px; color: var(--ink); resize: none; line-height: 1.8;
      min-height: 80px; font-family: var(--font-body);
    }
    .record-quick textarea::placeholder { color: var(--ink-faint); }
    .record-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .record-tools { display: flex; gap: 12px; }
    .record-tools button { background: none; border: none; color: var(--ink-faint); padding: 4px; cursor: pointer; transition: color 0.3s; }
    .record-tools button:hover { color: var(--life); }
    .record-save {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; background: var(--ink); color: var(--bg);
      border: none; padding: 8px 20px; cursor: pointer;
    }

    /* Story preview */
    .story-preview { border: 1px solid var(--line); padding: 24px; }
    .story-meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 14px; }
    .story-body {
      font-family: var(--font-display); font-style: italic;
      font-size: 15px; line-height: 1.85; color: var(--ink);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .story-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .resonance { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; display: flex; align-items: center; gap: 6px; }
    .resonance svg { width: 14px; height: 14px; stroke: var(--life); }
    .read-more { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; color: var(--life); text-transform: uppercase; }
  </style>
</head>
<body class="grain">

  <div class="frame">

    <div class="top">
      <div class="top-date fade-up">
        <span data-i18n="home_date_friday"></span><br>
        <span class="day" data-i18n="home_day_count"></span>
      </div>
      <div class="top-actions">
        <button id="lang-toggle"></button>
        <button id="theme-toggle" data-i18n-aria="theme_toggle"></button>
      </div>
    </div>

    <div class="question">
      <h1 class="fade-up fade-up-1" data-i18n="home_question"></h1>

      <div class="streak fade-up fade-up-3">
        <span class="streak-num">127</span>
        <span class="streak-label" data-i18n="home_streak_label"></span>
      </div>
    </div>

    <div class="hero-checked">
      <p class="checked-label" data-i18n="home_checked_label"></p>
      <div class="streak-num">127</div>
      <div class="streak-label" data-i18n="home_streak_label"></div>
    </div>

    <svg class="heartline fade-up fade-up-3" viewBox="0 0 600 40" preserveAspectRatio="none">
      <path d="M0 20 L100 20 L120 20 L130 5 L140 35 L150 2 L160 38 L170 20 L300 20 L320 20 L330 5 L340 35 L350 2 L360 38 L370 20 L600 20"/>
    </svg>

    <button id="cta-btn" class="cta fade-up fade-up-4" data-i18n="home_cta"></button>

    <div class="sections-wrap">

      <div class="section fade-up fade-up-5">
        <div class="section-head">
          <span class="section-title" data-i18n="home_section_today"></span>
        </div>
        <a href="../person/detail.html" class="birthday">
          <div class="birthday-avatar" data-i18n="person_today_card_name"></div>
          <div class="birthday-info">
            <div class="birthday-name">
              <span data-i18n="home_birthday_title_pre"></span><span class="tag" data-i18n="home_birthday_title_tag"></span><span data-i18n="home_birthday_title_post"></span>
            </div>
            <div class="birthday-sub" data-i18n="home_birthday_sub"></div>
          </div>
          <span class="birthday-arrow">→</span>
        </a>
      </div>

      <div class="section fade-up fade-up-5">
        <div class="section-head">
          <span class="section-title" data-i18n="home_section_daily"></span>
        </div>
        <div class="quote-card">
          <blockquote data-i18n="home_daily_quote"></blockquote>
          <div class="src" data-i18n="home_daily_src"></div>
        </div>
      </div>

      <div class="section fade-up fade-up-6">
        <div class="section-head">
          <span class="section-title" data-i18n="home_section_record"></span>
          <span style="font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)">0 / 200</span>
        </div>
        <div class="record-quick">
          <textarea data-i18n-placeholder="home_record_placeholder"></textarea>
          <div class="record-actions">
            <div class="record-tools">
              <button data-i18n-title="home_photo_btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
              </button>
              <button data-i18n-title="home_mood_btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 14s1 2 3 2 3-2 3-2"/></svg>
              </button>
            </div>
            <button class="record-save" data-i18n="home_save"></button>
          </div>
        </div>
      </div>

      <div class="section fade-up fade-up-6">
        <div class="section-head">
          <span class="section-title" data-i18n="home_section_voices"></span>
          <a href="../story/list.html" class="section-more" data-i18n="home_more"></a>
        </div>
        <a href="../story/detail.html" class="story-preview" style="display:block">
          <div class="story-meta" data-i18n="home_voice_meta"></div>
          <div class="story-body" data-i18n="home_voice_body"></div>
          <div class="story-foot">
            <span class="resonance">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
              1,243
            </span>
            <span class="read-more" data-i18n="home_read"></span>
          </div>
        </a>
      </div>

    </div>

  </div>

  <script>
    (function () {
      var KEY = 'sa-checked-2026-05-01';
      var btn = document.getElementById('cta-btn');

      function syncState() {
        var checked = localStorage.getItem(KEY) === '1';
        document.body.classList.toggle('checked', checked);
        if (btn && window.SA) {
          btn.setAttribute('data-i18n', checked ? 'home_cta_done' : 'home_cta');
          btn.textContent = window.SA.t(checked ? 'home_cta_done' : 'home_cta');
        }
      }

      btn.addEventListener('click', function () {
        if (localStorage.getItem(KEY) !== '1') {
          localStorage.setItem(KEY, '1');
        }
        window.location.href = '../checkin/record.html';
      });

      // Demo helper: long-press the streak number to reset state for review
      var streak = document.querySelector('.hero-checked .streak-num') || document.querySelector('.streak-num');
      if (streak) {
        var t;
        streak.addEventListener('mousedown', function () {
          t = setTimeout(function () { localStorage.removeItem(KEY); syncState(); }, 800);
        });
        streak.addEventListener('mouseup', function () { clearTimeout(t); });
        streak.addEventListener('mouseleave', function () { clearTimeout(t); });
      }

      document.addEventListener('sa:lang', syncState);
      syncState();
    })();
  </script>

</body>
</html>
