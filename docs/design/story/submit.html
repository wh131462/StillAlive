<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title data-i18n-title-key="nav_submit">Still Alive</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <style>
    .frame {
      width: 100%; max-width: 430px; margin: 0 auto;
      min-height: 100vh; padding: 0 24px;
      display: flex; flex-direction: column;
    }
    @media (min-width: 768px) { .frame { max-width: 720px; padding: 0 40px; } }
    @media (min-width: 1024px) { .frame { max-width: 880px; padding: 0 48px; } }

    .top { padding: 24px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .back { background: none; border: none; color: var(--ink-faint); font-size: 14px; cursor: pointer; }
    .top-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink); text-transform: uppercase; }
    .top-actions { display: flex; gap: 8px; }

    h1.title { font-family: var(--font-body); font-weight: 700; font-size: 28px; margin: 24px 0 4px; line-height: 1.1; letter-spacing: -0.005em; }
    @media (min-width: 768px) { h1.title { font-size: 36px; } }

    .intro { margin-top: 24px; padding: 20px; border-left: 2px solid var(--life); background: var(--life-soft); font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--ink-soft); line-height: 1.85; }

    .field { margin-top: 32px; }
    .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); display: flex; justify-content: space-between; margin-bottom: 8px; }
    .label .req { color: var(--life); }
    .input { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .input:focus-within { border-bottom-color: var(--life); }
    .input input { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; padding: 4px 0; color: var(--ink); min-width: 0; }
    .input input::placeholder { color: var(--ink-faint); }
    textarea.body-input { width: 100%; min-height: 220px; border: none; outline: none; resize: none; background: transparent; padding: 16px 0; font-family: var(--font-body); font-size: 17px; line-height: 1.85; color: var(--ink); border-bottom: 1px solid var(--line); }
    textarea.body-input::placeholder { color: var(--ink-faint); }
    .types { display: flex; flex-wrap: wrap; gap: 8px; }
    .type { padding: 8px 14px; font-family: var(--font-body); font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; transition: all 0.3s; }
    .type.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .submit-bar { position: sticky; bottom: 0; padding: 16px 0 24px; background: linear-gradient(180deg, transparent, var(--bg) 30%); margin-top: 40px; }
    .submit-note { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-faint); text-align: center; margin-bottom: 12px; text-transform: uppercase; }
    .submit-btn { width: 100%; padding: 18px; background: var(--ink); color: var(--bg); border: none; font-family: var(--font-body); font-weight: 700; font-size: 16px; letter-spacing: 0.04em; position: relative; overflow: hidden; cursor: pointer; }
    .submit-btn::before { content: ''; position: absolute; inset: 0; background: var(--life); transform: translateY(100%); transition: transform 0.4s var(--ease-breath); }
    .submit-btn:hover::before { transform: translateY(0); }
    .submit-btn span { position: relative; z-index: 1; }
  </style>
</head>
<body class="grain">
  <div class="frame">
    <div class="top">
      <a href="list.html" class="back" data-i18n="auth_back"></a>
      <span class="top-title" data-i18n="submit_top_title"></span>
      <div class="top-actions">
        <button id="lang-toggle"></button>
        <button id="theme-toggle" data-i18n-aria="theme_toggle"></button>
      </div>
    </div>

    <h1 class="title fade-up fade-up-1" data-i18n="submit_title"></h1>

    <div class="intro fade-up fade-up-2">
      <span data-i18n="submit_intro_a"></span><br>
      <span data-i18n="submit_intro_b"></span><br>
      <span data-i18n="submit_intro_c"></span>
    </div>

    <form onsubmit="event.preventDefault()" class="fade-up fade-up-3">
      <div class="field">
        <div class="label"><span data-i18n="submit_field_title"></span><span data-i18n="submit_field_title_optional"></span></div>
        <div class="input"><input type="text" data-i18n-placeholder="submit_field_title_placeholder" maxlength="30"></div>
      </div>

      <div class="field">
        <div class="label"><span data-i18n="submit_field_body"></span><span><span class="req">*</span> <span data-i18n="submit_field_body_req"></span></span></div>
        <textarea class="body-input" data-i18n-placeholder="submit_field_body_placeholder"></textarea>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);text-align:right;margin-top:6px">0 / 800</div>
      </div>

      <div class="field">
        <div class="label" data-i18n="submit_field_when"></div>
        <div class="input"><input type="text" data-i18n-placeholder="submit_field_when_placeholder"></div>
      </div>

      <div class="field">
        <div class="label" data-i18n="submit_field_category"></div>
        <div class="types">
          <span class="type active" data-i18n="submit_cat_accident"></span>
          <span class="type" data-i18n="submit_cat_illness"></span>
          <span class="type" data-i18n="submit_cat_mental"></span>
          <span class="type" data-i18n="submit_cat_nature"></span>
          <span class="type" data-i18n="submit_cat_other"></span>
        </div>
      </div>

      <div class="field">
        <div class="label" data-i18n="submit_field_email"></div>
        <div class="input"><input type="email" data-i18n-placeholder="submit_field_email_placeholder"></div>
      </div>

      <div class="submit-bar">
        <div class="submit-note" data-i18n="submit_review_note"></div>
        <button type="submit" class="submit-btn"><span data-i18n="submit_btn"></span></button>
      </div>
    </form>
  </div>
</body>
</html>
