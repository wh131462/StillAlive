<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>投稿 · 还活着</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <style>
    .frame { max-width: 430px; margin: 0 auto; min-height: 100vh; padding: 0 28px 0; display: flex; flex-direction: column; }
    .top { padding: 32px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .back { background: none; border: none; color: var(--ink-faint); font-size: 14px; }
    .top-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink); text-transform: uppercase; }
    #theme-toggle { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); }
    #theme-toggle::before { content: '🌙'; font-size: 13px; }
    html.dark #theme-toggle::before { content: '☀'; }

    h1.title { font-family: var(--font-display); font-style: italic; font-size: 36px; margin: 32px 0 4px; line-height: 1.1; }
    h1.title .zh { display: block; font-family: var(--font-body); font-style: normal; font-weight: 700; font-size: 24px; margin-top: 4px; }

    .intro { margin-top: 24px; padding: 20px; border-left: 2px solid var(--life); background: var(--life-soft); font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--ink-soft); line-height: 1.85; }

    .field { margin-top: 32px; }
    .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); display: flex; justify-content: space-between; margin-bottom: 8px; }
    .label .req { color: var(--life); }
    .input { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .input:focus-within { border-bottom-color: var(--life); }
    .input input { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; padding: 4px 0; color: var(--ink); }
    .input input::placeholder { color: var(--ink-faint); font-style: italic; font-family: var(--font-display); }
    textarea.body-input { width: 100%; min-height: 220px; border: none; outline: none; resize: none; background: transparent; padding: 16px 0; font-family: var(--font-display); font-style: italic; font-size: 17px; line-height: 1.85; color: var(--ink); border-bottom: 1px solid var(--line); }
    textarea.body-input::placeholder { color: var(--ink-faint); }
    .types { display: flex; flex-wrap: wrap; gap: 8px; }
    .type { padding: 8px 14px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; transition: all 0.3s; }
    .type.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .submit-bar { position: sticky; bottom: 0; padding: 16px 0 24px; background: linear-gradient(180deg, transparent, var(--bg) 30%); margin-top: 40px; }
    .submit-note { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-faint); text-align: center; margin-bottom: 12px; text-transform: uppercase; }
    .submit-btn { width: 100%; padding: 18px; background: var(--ink); color: var(--bg); border: none; font-family: var(--font-display); font-style: italic; font-size: 17px; letter-spacing: 0.05em; position: relative; overflow: hidden; }
    .submit-btn::before { content: ''; position: absolute; inset: 0; background: var(--life); transform: translateY(100%); transition: transform 0.4s var(--ease-breath); }
    .submit-btn:hover::before { transform: translateY(0); }
    .submit-btn span { position: relative; z-index: 1; }
  </style>
</head>
<body class="grain">
  <div class="frame">
    <div class="top"><a href="list.html" class="back">← Back</a><span class="top-title">SUBMIT</span><button id="theme-toggle" aria-label="theme"></button></div>

    <h1 class="title fade-up fade-up-1">Tell yours<span class="zh">讲述你的故事</span></h1>

    <div class="intro fade-up fade-up-2">
      这里收录"差点就没了，但我现在还活着"的瞬间。<br>
      关注活下来之后，不关注死亡本身。<br>
      故事完全匿名，经审核后发布。
    </div>

    <form onsubmit="event.preventDefault()" class="fade-up fade-up-3">
      <div class="field">
        <div class="label"><span>标题 / 首句 · TITLE</span><span>OPTIONAL · ≤30</span></div>
        <div class="input"><input type="text" placeholder="为你的故事起一个开头" maxlength="30"></div>
      </div>

      <div class="field">
        <div class="label"><span>正文 · BODY</span><span><span class="req">*</span> 100~800</span></div>
        <textarea class="body-input" placeholder="讲述那个你差点就没了，但现在还活着的瞬间..."></textarea>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);text-align:right;margin-top:6px">0 / 800</div>
      </div>

      <div class="field">
        <div class="label">大致时间 · WHEN</div>
        <div class="input"><input type="text" placeholder="例：2024 年冬、三年前"></div>
      </div>

      <div class="field">
        <div class="label">故事类型 · CATEGORY</div>
        <div class="types">
          <span class="type active">ACCIDENT 意外</span>
          <span class="type">ILLNESS 疾病</span>
          <span class="type">MENTAL 心理</span>
          <span class="type">NATURE 自然</span>
          <span class="type">OTHER 其他</span>
        </div>
      </div>

      <div class="field">
        <div class="label">联系邮箱 · EMAIL</div>
        <div class="input"><input type="email" placeholder="审核通知用，可不填"></div>
      </div>

      <div class="submit-bar">
        <div class="submit-note">REVIEW WITHIN 48 HOURS</div>
        <button type="submit" class="submit-btn"><span>Submit · 提交故事</span></button>
      </div>
    </form>
  </div>
</body>
</html>
