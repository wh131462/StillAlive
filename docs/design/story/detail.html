<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title data-i18n-title-key="story_title">Still Alive</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <style>
    body { min-height: 100vh; }
    .frame {
      width: 100%; max-width: 640px; margin: 0 auto;
      padding: 0 24px 120px;
    }
    @media (min-width: 768px) { .frame { padding: 0 40px 120px; } }
    @media (min-width: 1024px) { .frame { padding: 0 48px 120px; max-width: 720px; } }

    .top {
      padding: 24px 0 0; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      padding-bottom: 16px; border-bottom: 1px solid transparent; transition: all 0.4s;
    }
    .back { background: none; border: none; color: var(--ink-faint); font-size: 14px; cursor: pointer; }
    .top-r { display: flex; gap: 8px; }
    .btn-icon { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; margin-top: 48px; }
    @media (min-width: 768px) { .meta { margin-top: 64px; } }

    article {
      margin-top: 32px;
      font-family: var(--font-body); font-weight: 300;
      font-size: 18px; line-height: 2.05; color: var(--ink);
      letter-spacing: 0.005em;
    }
    @media (min-width: 768px) { article { font-size: 20px; line-height: 2.1; } }
    article p { margin: 0 0 28px; }
    article p:first-child::first-letter {
      font-family: var(--font-display); font-weight: 700; font-size: 56px;
      float: left; line-height: 0.85; margin-right: 8px; margin-top: 6px;
      color: var(--life);
    }
    @media (min-width: 768px) { article p:first-child::first-letter { font-size: 64px; } }

    .resonance-section { text-align: center; margin-top: 64px; padding-top: 40px; }
    @media (min-width: 768px) { .resonance-section { margin-top: 80px; padding-top: 48px; } }
    .heartwave {
      width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 24px;
      border: 1px solid var(--life); display: flex; align-items: center; justify-content: center;
      transition: all 0.4s; cursor: pointer;
      animation: breathe 3s var(--ease-breath) infinite;
    }
    .heartwave:hover { background: var(--life-soft); transform: scale(1.1); }
    .heartwave svg { width: 28px; height: 28px; stroke: var(--life); }
    .resonance-txt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.15em; }
    .resonance-num { font-family: var(--font-display); font-style: italic; font-size: 28px; color: var(--life); margin-top: 8px; }

    .share-row { display: flex; gap: 12px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
    .share-btn { padding: 10px 20px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; transition: all 0.3s; cursor: pointer; }
    .share-btn:hover { border-color: var(--life); color: var(--life); }

    .helpline {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--line);
      padding: 16px 24px; font-family: var(--font-mono); font-size: 10px;
      line-height: 1.8; color: var(--ink-faint); letter-spacing: 0.05em;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    @media (min-width: 768px) { .helpline { padding: 16px 40px; } }
    .helpline-inner { max-width: 720px; margin: 0 auto; }
    .helpline strong { color: var(--ink-soft); }
  </style>
</head>
<body class="grain">
  <div class="frame">
    <div class="top">
      <a href="list.html" class="back" data-i18n="auth_back"></a>
      <div class="top-r">
        <button class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
        <button id="lang-toggle" class="btn-icon"></button>
        <button id="theme-toggle" class="btn-icon" data-i18n-aria="theme_toggle"></button>
      </div>
    </div>

    <div class="meta fade-up" data-i18n="story_detail_meta"></div>

    <article>
      <p class="fade-up fade-up-1" data-i18n="story_detail_p1"></p>
      <p class="fade-up fade-up-2" data-i18n="story_detail_p2"></p>
      <p class="fade-up fade-up-3" data-i18n="story_detail_p3"></p>
      <p class="fade-up fade-up-4" data-i18n="story_detail_p4"></p>
      <p class="fade-up fade-up-5" data-i18n="story_detail_p5"></p>
      <p class="fade-up fade-up-5" data-i18n="story_detail_p6"></p>
      <p class="fade-up fade-up-6" data-i18n="story_detail_p7"></p>
    </article>

    <div class="resonance-section fade-up fade-up-6">
      <div class="heartwave">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
      </div>
      <div class="resonance-txt" data-i18n="story_resonance_label"></div>
      <div class="resonance-num">&hearts; 1,243</div>
    </div>

    <div class="share-row fade-up fade-up-6">
      <button class="share-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg><span data-i18n="story_copy"></span></button>
      <button class="share-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg><span data-i18n="story_share_image"></span></button>
    </div>
  </div>

  <div class="helpline">
    <div class="helpline-inner">
      <strong data-i18n="story_helpline_label"></strong><br>
      <span data-i18n="story_helpline_numbers"></span>
    </div>
  </div>
</body>
</html>
