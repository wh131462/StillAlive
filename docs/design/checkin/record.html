<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title data-i18n-title-key="record_title">Still Alive</title>
  <link rel="stylesheet" href="../shared/breathe.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <style>
    .frame {
      width: 100%; max-width: 430px; margin: 0 auto;
      min-height: 100vh; padding: 0 24px;
      display: flex; flex-direction: column;
    }
    @media (min-width: 768px) { .frame { max-width: 720px; padding: 0 40px; } }
    @media (min-width: 1024px) { .frame { max-width: 880px; padding: 0 48px; } }

    .top { padding: 24px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .back { background: none; border: none; color: var(--ink-faint); font-size: 14px; cursor: pointer; }
    .back:hover { color: var(--life); }
    .top-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink); text-transform: uppercase; }
    .top-actions { display: flex; gap: 8px; }

    .hero { padding: 40px 0 24px; }
    @media (min-width: 768px) { .hero { padding: 56px 0 32px; } }
    .hero h1 { font-family: var(--font-body); font-weight: 700; font-size: 32px; margin: 0; line-height: 1.1; letter-spacing: -0.005em; }
    @media (min-width: 768px) { .hero h1 { font-size: 42px; } }
    .hero-sub { font-family: var(--font-display); font-style: italic; color: var(--ink-soft); font-size: 14px; margin-top: 16px; line-height: 1.7; }

    .section-t { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; margin: 32px 0 12px; }

    .photo-drop { aspect-ratio: 4/3; border: 1px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--ink-faint); transition: border-color 0.3s; }
    .photo-drop:hover { border-color: var(--life); color: var(--life); }
    .photo-drop p { font-family: var(--font-display); font-style: italic; font-size: 13px; margin: 0; }
    @media (min-width: 1024px) { .photo-drop { aspect-ratio: 16/9; max-height: 280px; } }

    .text-area {
      width: 100%; min-height: 200px; border: none; outline: none; resize: none;
      background: transparent; padding: 16px 0;
      font-family: var(--font-body); font-size: 17px; line-height: 1.85;
      color: var(--ink); border-bottom: 1px solid var(--line);
    }
    .text-area::placeholder { color: var(--ink-faint); }
    .word-count { display: flex; justify-content: flex-end; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-faint); margin-top: 6px; }

    .moods { display: flex; flex-wrap: wrap; gap: 8px; }
    .mood {
      padding: 8px 14px; font-family: var(--font-body); font-size: 12px;
      border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
      transition: all 0.3s; cursor: pointer;
    }
    .mood.active { background: var(--life); color: var(--bg); border-color: var(--life); }
    .mood:hover { color: var(--life); border-color: var(--life); }

    .actions { display: flex; gap: 12px; padding: 24px 0 32px; margin-top: 40px; border-top: 1px solid var(--line); }
    .skip { flex: 1; padding: 16px; background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-family: var(--font-body); font-size: 14px; text-align: center; text-decoration: none; cursor: pointer; }
    .save { flex: 1; padding: 16px; background: var(--life); color: var(--bg); border: none; font-family: var(--font-body); font-weight: 700; font-size: 14px; letter-spacing: 0.05em; text-align: center; text-decoration: none; cursor: pointer; }
    .save:hover { animation: breathe 1.5s var(--ease-breath) infinite; }
  </style>
</head>
<body class="grain">
  <div class="frame">
    <div class="top">
      <a href="index.html" class="back" data-i18n="auth_back"></a>
      <span class="top-title" data-i18n="record_top_title"></span>
      <div class="top-actions">
        <button id="lang-toggle"></button>
        <button id="theme-toggle" data-i18n-aria="theme_toggle"></button>
      </div>
    </div>

    <div class="hero">
      <h1 class="fade-up fade-up-1" data-i18n="record_title"></h1>
      <p class="hero-sub fade-up fade-up-2"><span data-i18n="record_sub_a"></span><br><span data-i18n="record_sub_b"></span></p>
    </div>

    <div class="fade-up fade-up-3">
      <div class="section-t" data-i18n="record_photo"></div>
      <div class="photo-drop">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
        <p data-i18n="record_photo_upload"></p>
      </div>
    </div>

    <div class="fade-up fade-up-4">
      <div class="section-t" data-i18n="record_words"></div>
      <textarea class="text-area" data-i18n-placeholder="record_words_placeholder" data-i18n="record_words_sample"></textarea>
      <div class="word-count">142 / 500</div>
    </div>

    <div class="fade-up fade-up-5">
      <div class="section-t" data-i18n="record_mood"></div>
      <div class="moods">
        <button class="mood active" data-i18n="record_mood_happy"></button>
        <button class="mood" data-i18n="record_mood_calm"></button>
        <button class="mood" data-i18n="record_mood_down"></button>
        <button class="mood" data-i18n="record_mood_tired"></button>
        <button class="mood" data-i18n="record_mood_angry"></button>
        <button class="mood" data-i18n="record_mood_touched"></button>
      </div>
    </div>

    <div class="actions">
      <a href="index.html" class="skip" data-i18n="record_skip"></a>
      <a href="milestone.html" class="save" data-i18n="record_save"></a>
    </div>
  </div>
</body>
</html>
