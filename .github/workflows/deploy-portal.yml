name: Deploy Portal

on:
  push:
    branches:
      - master
    paths:
      - 'apps/portal/**'
      - 'apps/mobile/assets/branding/logo-mark.svg'
      - 'release/latest.json'
      - '.github/workflows/deploy-portal.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portal
        env:
          PORTAL_BASE: /
        run: pnpm --filter @still-alive/portal build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portal/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
