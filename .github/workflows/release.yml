name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本，留空使用 app.json 中的版本
        required: false
        type: string
      releaseNotes:
        description: 更新详情，留空使用已提交的 latest.json
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'feat: v') }}"
    runs-on: ubuntu-latest
    env:
      STILL_ALIVE_ANDROID_KEYSTORE_BASE64: ${{ secrets.STILL_ALIVE_ANDROID_KEYSTORE_BASE64 }}
      STILL_ALIVE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STILL_ALIVE_ANDROID_KEYSTORE_PASSWORD }}
      STILL_ALIVE_ANDROID_KEY_ALIAS: ${{ secrets.STILL_ALIVE_ANDROID_KEY_ALIAS }}
      STILL_ALIVE_ANDROID_KEY_PASSWORD: ${{ secrets.STILL_ALIVE_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager 'ndk;27.1.12297006'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release metadata
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.releaseNotes }}
        run: node ./scripts/release.mjs --ci

      - name: Restore production keystore
        env:
          STILL_ALIVE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/still-alive-release.jks
        run: |
          if [[ -z "$STILL_ALIVE_ANDROID_KEYSTORE_BASE64" ]]; then
            echo 'Missing secret: STILL_ALIVE_ANDROID_KEYSTORE_BASE64' >&2
            exit 1
          fi
          node -e 'require("node:fs").writeFileSync(process.env.STILL_ALIVE_ANDROID_KEYSTORE_PATH, Buffer.from(process.env.STILL_ALIVE_ANDROID_KEYSTORE_BASE64, "base64"))'
          test -s "$STILL_ALIVE_ANDROID_KEYSTORE_PATH"

      - name: Build signed APK
        env:
          STILL_ALIVE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/still-alive-release.jks
        run: pnpm build:apk

      - name: Prepare release notes
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: node -e 'const fs = require("node:fs"); const manifest = require("./release/latest.json"); fs.writeFileSync(process.env.RELEASE_NOTES_FILE, manifest.releaseNotes || `Android release v${manifest.versionName}`)'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          gh release create '${{ steps.release.outputs.tag }}' \
            'apps/mobile/android/app/build/outputs/apk/release/${{ steps.release.outputs.apk_name }}' \
            'release/latest.json' \
            --latest \
            --target "$GITHUB_SHA" \
            --title '${{ steps.release.outputs.tag }}' \
            --notes-file "$RELEASE_NOTES_FILE"
